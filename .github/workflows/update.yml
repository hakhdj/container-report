name: 自动更新供应商空容器报表

on:
  # 飞书自动化流程触发
  repository_dispatch:
    types: [feishu_update, feishu_data_update]
  # 定时备份（每天北京时间 7:00 = UTC 23:00）
  schedule:
    - cron: '0 23 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 方案A：飞书自动化流程带了数据（client_payload.records）
      # ============================================================
      - name: Save trigger data (if provided)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.records != ''
        run: |
          cat > feishu_records.json << 'RECORDS_EOF'
          ${{ github.event.client_payload.records }}
          RECORDS_EOF
          echo "✅ 飞书自动化流程数据已保存"

      # ============================================================
      # 方案B：飞书只发了触发信号，GitHub Actions 自己去飞书拉数据
      # ============================================================
      - name: Get Feishu tenant access token
        if: github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.records == '')
        id: feishu-token
        run: |
          curl -s -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
            -H 'Content-Type: application/json' \
            -d '{"app_id":"${{ secrets.FEISHU_APP_ID }}","app_secret":"${{ secrets.FEISHU_APP_SECRET }}"}' \
            -o _token_resp.json
          CODE=$(python3 -c "import json; print(json.loads(open('_token_resp.json').read()).get('code','?'))")
          echo "Token response code: $CODE"
          TOKEN=$(python3 -c "import json; print(json.loads(open('_token_resp.json').read()).get('tenant_access_token',''))")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch data from Feishu bitable
        if: github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.records == '')
        id: fetch-feishu
        continue-on-error: true
        env:
          FEISHU_TOKEN: ${{ steps.feishu-token.outputs.token }}
          APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, sys

          app_token = '${{ secrets.FEISHU_APP_TOKEN }}'
          table_id = '${{ secrets.FEISHU_TABLE_ID }}'
          token = '${{ steps.feishu-token.outputs.token }}'
          all_items = []
          page_token = ''

          while True:
              url = f'https://open.feishu.cn/open-apis/bitable/v1/applications/{app_token}/tables/{table_id}/records?page_size=500'
              if page_token:
                  url += f'&page_token={page_token}'
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
              except Exception as e:
                  print(f'❌ 飞书API请求失败: {e}')
                  sys.exit(1)

              code = data.get('code', -1)
              if code != 0:
                  print(f'❌ 飞书API返回错误: code={code}, msg={data.get("msg","")}')
                  sys.exit(1)

              items = data.get('data', {}).get('items', [])
              all_items.extend(items)
              page_token = data.get('data', {}).get('page_token', '')
              if not page_token:
                  break
              print(f'  已获取 {len(all_items)} 条，继续下一页...')

          result = {'items': all_items}
          with open('feishu_records.json', 'w') as f:
              json.dump(result, f, ensure_ascii=False)
          print(f'✅ 飞书数据获取完成，共 {len(all_items)} 条记录')
          PYEOF

      # ============================================================
      # 数据处理和HTML更新
      # ============================================================
      - name: Check data availability
        id: data-check
        run: |
          if [ -f feishu_records.json ] && [ -s feishu_records.json ]; then
            echo "has_data=true" >> $GITHUB_OUTPUT
            COUNT=$(python3 -c "import json; d=json.loads(open('feishu_records.json').read()); items=d.get('items', d if isinstance(d, list) else []); print(len(items))")
            echo "📊 数据文件存在，共 $COUNT 条记录"
          else
            echo "has_data=false" >> $GITHUB_OUTPUT
            echo "⚠️ 无数据文件，跳过更新"
          fi

      - name: Process data and update HTML
        if: steps.data-check.outputs.has_data == 'true'
        run: |
          node update_feishu_data.js

      - name: Check if HTML changed
        if: steps.data-check.outputs.has_data == 'true'
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据未变化，跳过更新"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已变化，将更新报表"
          fi

      - name: Skip update (no data available)
        if: steps.data-check.outputs.has_data != 'true'
        run: |
          echo "⚠️ 无法获取数据，跳过本次更新"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "auto-update"
          git config user.email "auto@update.bot"
          git pull --rebase origin main || true
          git add index.html
          git commit -m "自动更新报表数据 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Setup Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
