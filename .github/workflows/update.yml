name: 自动更新供应商空容器报表

on:
  # 定时拉取 Google Sheets 数据（每 30 分钟）
  schedule:
    - cron: '*/30 * * * *'
  # 手动触发
  workflow_dispatch:
  # 推送触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 从 Google Sheets 拉取数据
      # ============================================================
      - name: Authenticate with Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Fetch data from Google Sheets
        id: fetch
        env:
          SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          SHEETS_RANGE: 'A:Z'
        run: |
          # 获取 access token
          TOKEN=$(cat $GOOGLE_APPLICATION_CREDENTIALS | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data.get('client_email', ''))
          " 2>/dev/null || echo "")

          # 用 gcloud 获取 access token（auth step 已配置）
          ACCESS_TOKEN=$(gcloud auth application-default print-access-token 2>/dev/null || echo "")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ 无法获取 Google access token"
            exit 1
          fi

          # 调用 Google Sheets API
          URL="https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${SHEETS_RANGE}"
          HTTP_CODE=$(curl -s -o google_sheets_data.json -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$URL")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Google Sheets API 错误 (HTTP $HTTP_CODE):"
            cat google_sheets_data.json
            exit 1
          fi

          # 显示获取的数据预览
          ROWS=$(python3 -c "
          import json
          with open('google_sheets_data.json') as f:
              d = json.load(f)
          print(len(d.get('values', [])))
          ")
          echo "✅ Google Sheets 数据获取完成，共 $ROWS 行"

      # ============================================================
      # 数据处理和HTML更新
      # ============================================================
      - name: Process data and update HTML
        run: |
          node update_google_sheets_data.js

      - name: Check if HTML changed
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据未变化，跳过更新"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已变化，将更新报表"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "auto-update"
          git config user.email "auto@update.bot"
          git pull --rebase origin main || true
          git add index.html
          git commit -m "自动更新报表数据 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Setup Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
