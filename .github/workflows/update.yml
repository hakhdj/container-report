name: 自动更新供应商空容器报表

on:
  # 避开每小时整点的 GitHub Actions 高峰；GitHub cron 仍不承诺准点执行。
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 忽略修改时间并强制重新拉取腾讯文档
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [update-report]
  # 人工修改网页或工作流后重新部署 Pages；不重复拉取腾讯文档。
  push:
    branches: [main]

concurrency:
  group: container-report-update
  cancel-in-progress: false

jobs:
  update-report:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      html_changed: ${{ steps.changes.outputs.html_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Tencent Docs modification time
        id: check-doc
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
          TENCENT_SMARTSHEET_FILE_ID: ${{ secrets.TENCENT_SMARTSHEET_FILE_ID }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh || 'false' }}
        run: node check_tencent_doc.js

      - name: Pull Tencent Docs data and update HTML
        if: steps.check-doc.outputs.changed == 'true'
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
          TENCENT_SMARTSHEET_FILE_ID: ${{ secrets.TENCENT_SMARTSHEET_FILE_ID }}
          TENCENT_SMARTSHEET_SHEET_ID: ${{ secrets.TENCENT_SMARTSHEET_SHEET_ID }}
          TENCENT_LAST_MODIFY: ${{ steps.check-doc.outputs.last_modify }}
        run: |
          node update_tencent_docs_data.js
          printf '%s\n' '${{ steps.check-doc.outputs.last_modify }}' > .last_modify

      - name: Detect repository changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "html_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "html_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- index.html .last_modify; then
            echo "repo_changed=false" >> "$GITHUB_OUTPUT"
            echo "腾讯文档和网页数据均无变化"
          else
            echo "repo_changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- index.html .last_modify
          fi

      - name: Commit and push
        if: steps.changes.outputs.repo_changed == 'true'
        shell: bash
        run: |
          git config user.name "auto-update"
          git config user.email "auto@update.bot"
          git add index.html .last_modify
          git commit -m "自动更新报表数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "第 ${attempt} 次推送失败，稍后重试"
            sleep $((attempt * 3))
          done
          exit 1

      - name: Setup Pages
        if: steps.changes.outputs.html_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.html_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.html_changed == 'true'
        uses: actions/deploy-pages@v4

  deploy-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
