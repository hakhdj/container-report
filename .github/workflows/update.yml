name: 自动更新供应商空容器报表

on:
  # 定时拉取腾讯文档数据（每 30 分钟）
  schedule:
    - cron: '*/30 * * * *'
  # 手动触发
  workflow_dispatch:
  # 推送触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 从腾讯文档 MCP 拉取数据并更新 HTML
      # ============================================================
      - name: Process Tencent Docs data and update HTML
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
          TENCENT_SMARTSHEET_FILE_ID: ${{ secrets.TENCENT_SMARTSHEET_FILE_ID }}
          TENCENT_SMARTSHEET_SHEET_ID: ${{ secrets.TENCENT_SMARTSHEET_SHEET_ID }}
        run: |
          node update_tencent_docs_data.js

      - name: Check if HTML changed
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据未变化，跳过更新"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已变化，将更新报表"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "auto-update"
          git config user.email "auto@update.bot"
          git pull --rebase origin main || true
          git add index.html
          git commit -m "自动更新报表数据 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Setup Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
