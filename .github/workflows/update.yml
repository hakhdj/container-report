name: 自动更新供应商空容器报表

on:
  # 飞书自动化流程触发
  repository_dispatch:
    types: [feishu_update, feishu_data_update]
  # 定时备份（每天北京时间 7:00 = UTC 23:00）
  schedule:
    - cron: '0 23 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 方案A：飞书自动化流程带了数据（client_payload.records）
      # ============================================================
      - name: Save trigger data (if provided)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.records != ''
        run: |
          cat > feishu_records.json << 'RECORDS_EOF'
          ${{ github.event.client_payload.records }}
          RECORDS_EOF
          echo "✅ 飞书自动化流程数据已保存"
          echo "Records count: $(python3 -c "import json; print(len(json.load(open('feishu_records.json')).get('items',json.load(open('feishu_records.json')))))" 2>/dev/null || echo 'unknown')"

      # ============================================================
      # 方案B：飞书只发了触发信号，GitHub Actions 自己去飞书拉数据
      # ============================================================
      - name: Get Feishu tenant access token
        if: github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.records == '')
        id: feishu-token
        run: |
          RESP=$(curl -s -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
            -H 'Content-Type: application/json' \
            -d '{"app_id":"${{ secrets.FEISHU_APP_ID }}","app_secret":"${{ secrets.FEISHU_APP_SECRET }}"}')
          echo "Token response code: $(echo $RESP | python3 -c 'import sys,json; print(json.load(sys.stdin).get("code","?"))')"
          TOKEN=$(echo $RESP | python3 -c "import sys,json; print(json.load(sys.stdin).get('tenant_access_token',''))")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch data from Feishu bitable
        if: github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.records == '')
        id: fetch-feishu
        continue-on-error: true
        env:
          FEISHU_TOKEN: ${{ steps.feishu-token.outputs.token }}
          APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          # 分页获取所有记录
          PAGE_TOKEN=""
          echo '{"items":[]}' > feishu_records.json

          while true; do
            URL="https://open.feishu.cn/open-apis/bitable/v1/applications/${APP_TOKEN}/tables/${TABLE_ID}/records?page_size=500"
            if [ -n "$PAGE_TOKEN" ]; then
              URL="${URL}&page_token=${PAGE_TOKEN}"
            fi

            RESP=$(curl -s -X GET "$URL" \
              -H "Authorization: Bearer $FEISHU_TOKEN")

            # 检查API返回
            CODE=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('code',-1))")
            if [ "$CODE" != "0" ]; then
              echo "⚠️ 飞书API暂不可用: $(echo "$RESP" | head -c 200)"
              echo "fetch_success=false" >> $GITHUB_OUTPUT
              exit 1
            fi

            # 合并记录
            echo "$RESP" > _page.json
            python3 -c "
          import json
          with open('_page.json') as f:
              resp = json.load(f)
          with open('feishu_records.json') as f:
              data = json.load(f)
          data['items'].extend(resp['data']['items'])
          with open('feishu_records.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False)
          "

            # 检查是否有下一页
            PAGE_TOKEN=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('page_token',''))")
            if [ -z "$PAGE_TOKEN" ]; then
              break
            fi
            echo "Fetching next page: $PAGE_TOKEN"
          done

          TOTAL=$(python3 -c "import json; print(len(json.load(open('feishu_records.json'))['items']))")
          echo "✅ 飞书数据获取完成，共 $TOTAL 条记录"
          echo "fetch_success=true" >> $GITHUB_OUTPUT

      # ============================================================
      # 数据处理和HTML更新（仅当有数据时执行）
      # ============================================================
      - name: Process data and update HTML
        if: github.event_name == 'push' || (github.event_name == 'repository_dispatch' && github.event.client_payload.records != '') || steps.fetch-feishu.outputs.fetch_success == 'true'
        run: |
          node update_feishu_data.js

      - name: Check if HTML changed
        if: github.event_name == 'push' || (github.event_name == 'repository_dispatch' && github.event.client_payload.records != '') || steps.fetch-feishu.outputs.fetch_success == 'true'
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据未变化，跳过更新"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已变化，将更新报表"
          fi

      - name: Skip update (no data available)
        if: github.event_name != 'push' && (github.event_name == 'repository_dispatch' && github.event.client_payload.records == '') && steps.fetch-feishu.outputs.fetch_success != 'true'
        run: |
          echo "⚠️ 无法获取数据（飞书API暂不可用），跳过本次更新"
          echo "请在飞书自动化流程中配置发送数据到 GitHub Actions"
          echo "详见飞书自动化流程第三步配置"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "auto-update"
          git config user.email "auto@update.bot"
          git pull --rebase origin main || true
          git add index.html
          git commit -m "自动更新报表数据 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Setup Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
